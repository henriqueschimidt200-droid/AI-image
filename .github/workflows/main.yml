name: AI Creator - Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar AI Creator
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      # Cria uma estrutura Android moderna caso ela não exista
      - name: Criar Android moderno
        shell: bash
        run: |
          set -e

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android não encontrado. Criando projeto Android moderno..."

            rm -rf android

            flutter create \
              --platforms=android \
              --android-language kotlin \
              --org com.aicreator \
              --project-name ai_creator \
              .

          else
            echo "Android já existe."
          fi

      # Garante que o nome mostrado no celular seja AI Creator
      - name: Configurar nome do aplicativo
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="AI Creator"/g' "$MANIFEST"

            if ! grep -q 'android:label="AI Creator"' "$MANIFEST"; then
              sed -i 's/<application /<application android:label="AI Creator" /' "$MANIFEST"
            fi
          fi

          echo "Nome configurado:"
          grep -n 'AI Creator' "$MANIFEST" || true

      # Verifica se não ficou nenhum Android V1
      - name: Verificar Android
        shell: bash
        run: |
          set -e

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/aicreator/ai_creator/MainActivity.kt

          if grep -R "io.flutter.app.FlutterActivity" android 2>/dev/null; then
            echo "ERRO: Android V1 encontrado."
            exit 1
          fi

          if grep -R "io.flutter.app.FlutterApplication" android 2>/dev/null; then
            echo "ERRO: Android V1 encontrado."
            exit 1
          fi

          echo "Android V2 confirmado."

      - name: Instalar dependências
        run: flutter pub get

      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências novamente
        run: flutter pub get

      - name: Compilar APK
        shell: bash
        run: |
          set +e

          flutter build apk --release 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "BUILD_EXIT=$BUILD_EXIT" >> "$GITHUB_ENV"

          exit $BUILD_EXIT

      - name: Diagnóstico
        if: always()
        shell: bash
        run: |
          echo "## 🩺 Diagnóstico AI Creator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${BUILD_EXIT:-1}" = "0" ]; then
            echo "### ✅ APK criado com sucesso" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nome do aplicativo: **AI Creator**" >> "$GITHUB_STEP_SUMMARY"
            echo "Arquivo: **app-release.apk**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ O APK não foi compilado" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Verifique o arquivo **build.log** nos artefatos." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Enviar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Logs
          path: |
            build.log
            flutter_build.log
          if-no-files-found: ignore
